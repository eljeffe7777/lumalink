<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">LumaLink</title>
  <desc id="desc">A glowing connected light mark paired with the LumaLink wordmark.</desc>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55F5D2"/>
      <stop offset="0.52" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#A9B9D4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="38" fill="#08111F"/>
  <g transform="translate(78 72)">
    <path d="M84 40v44M84 148v52M40 104H20M148 104h20M52 72 37 57M116 136l15 15M116 72l15-15M52 136l-15 15" fill="none" stroke="url(#beam)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M84 78c-17 0-30 13-30 29 0 11 6 20 15 25v15h30v-15c9-5 15-14 15-25 0-16-13-29-30-29Z" fill="none" stroke="#EAF6FF" stroke-width="9" stroke-linejoin="round"/>
    <path d="M72 160h24M76 171h16" stroke="url(#beam)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="84" cy="107" r="9" fill="url(#beam)" filter="url(#glow)"/>
    <path d="M117 181h69a24 24 0 0 0 24-24v-7" fill="none" stroke="url(#beam)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="210" cy="137" r="7" fill="#55F5D2"/>
    <path d="M186 181h34" stroke="#55F5D2" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="350" y="218" fill="url(#word)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="112" font-weight="650" letter-spacing="-5">Luma<tspan fill="url(#beam)">Link</tspan></text>
  <path d="M355 266h462" stroke="#1B2A40" stroke-width="2"/>
  <text x="358" y="306" fill="#7F91AA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="6">GOVEE LIGHT CONTROL</text>
</svg>


